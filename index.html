let audioCtx = null;
function playTone(good, enabled) {
  if (!enabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    const freqs = good ? [523, 659, 784] : [330, 247];
    freqs.forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = f; o.type = "sine";
      g.gain.setValueAtTime(0.12, now + i * 0.09);
      g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.25);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(now + i * 0.09); o.stop(now + i * 0.09 + 0.3);
    });
  } catch (e) {}
}

function speak(text, rate) {
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = rate || 0.9;
    const voices = window.speechSynthesis.getVoices();
    const enVoice = voices.find(v => v.lang.startsWith("en"));
    if (enVoice) u.voice = enVoice;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

/* ============================================================
   שכבת AI אופציונלית — Anthropic API
   כישלון בקריאה לעולם לא שובר את האפליקציה: נופלים חזרה למאגר המובנה
   ============================================================ */

async function callClaude(apiKey, systemPrompt, userPrompt, schema) {
  const body = {
    model: "claude-opus-4-8",
    max_tokens: 2000,
    system: systemPrompt,
    messages: [{ role: "user", content: userPrompt }],
  };
  if (schema) body.output_config = { format: { type: "json_schema", schema } };
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      // הכרחי לקריאות ישירות מהדפדפן (CORS)
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error("API error " + res.status);
  const data = await res.json();
  if (data.stop_reason === "refusal" || !data.content || !data.content.length) throw new Error("empty response");
  const textBlock = data.content.find(b => b.type === "text");
  if (!textBlock) throw new Error("no text");
  return textBlock.text;
}

// יצירת תרגילי דקדוק חדשים מותאמים לפרופיל
async function aiGenerateGrammar(apiKey, profile) {
  const schema = {
    type: "object",
    properties: {
      items: {
        type: "array",
        items: {
          type: "object",
          properties: {
            q: { type: "string" }, options: { type: "array", items: { type: "string" } },
            answer: { type: "string" }, explain: { type: "string" },
          },
          required: ["q", "options", "answer", "explain"], additionalProperties: false,
        },
      },
    },
    required: ["items"], additionalProperties: false,
  };
  const level = profile.scores.grammar;
  const text = await callClaude(apiKey,
    "You create English grammar exercises for Hebrew-speaking middle school students (ages 12-15). Questions are fill-in-the-blank sentences in English with 3 options. The 'explain' field must be a short, friendly explanation in Hebrew.",
    `Create 5 grammar exercises at difficulty ${level} out of 5. Focus on tenses (present/past/future/present perfect) and word order. The student's weak area: ${profile.focusArea || "general"}. Each question is an English sentence with ___ for the blank.`,
    schema);
  const parsed = JSON.parse(text);
  return parsed.items.filter(it => it.q && it.options && it.options.includes(it.answer))
    .map((it, i) => ({ ...it, id: "ai-g" + Date.now() + i, level }));
}

// יצירת מילים חדשות לאוצר מילים
async function aiGenerateVocab(apiKey, profile) {
  const schema = {
    type: "object",
    properties: {
      items: {
        type: "array",
        items: {
          type: "object",
          properties: {
            en: { type: "string" }, he: { type: "string" }, sentence: { type: "string" },
          },
          required: ["en", "he", "sentence"], additionalProperties: false,
        },
      },
    },
    required: ["items"], additionalProperties: false,
  };
  const known = VOCAB.map(v => v.en).join(", ");
  const text = await callClaude(apiKey,
    "You create English vocabulary cards for Hebrew-speaking middle school students (ages 12-15). 'he' is the Hebrew translation, 'sentence' is a simple example sentence in English.",
    `Create 6 useful English words at difficulty ${profile.scores.vocab} out of 5. Do NOT use these words: ${known}.`,
    schema);
  const parsed = JSON.parse(text);
  return parsed.items.map((it, i) => ({ ...it, id: "ai-v" + Date.now() + i, level: profile.scores.vocab }));
}

// הסבר מותאם אישית כשטועים
async function aiExplainMistake(apiKey, question, wrongAnswer, correctAnswer) {
  return await callClaude(apiKey,
    "You are a friendly English tutor for Hebrew-speaking teens. Answer in simple Hebrew (2-3 sentences max), encouraging tone, never judgmental. You may include English words for the grammar terms.",
    `The student answered "${wrongAnswer}" but the correct answer is "${correctAnswer}" for the question: "${question}". Explain the rule briefly in Hebrew.`);
}

/* ============================================================
   שלב 1 — שאלון אבחון אדפטיבי
   ============================================================ */

// סדר התחומים בשאלון: 10 שאלות, אחת על המסך בכל פעם
const DIAG_SEQUENCE = ["vocab","vocab","grammar","grammar","reading","sentence","sentence","spelling","spelling","confidence"];

// בוחר שאלה לתחום ברמת קושי נתונה (1-3), בלי לחזור על שאלות
function pickDiagQuestion(domain, difficulty, usedIds) {
  let pool = [];
  if (domain === "vocab") {
    pool = VOCAB.filter(v => v.level === difficulty && !usedIds.has(v.id)).map(v => {
      const wrong = VOCAB.filter(o => o.id !== v.id).sort(() => Math.random() - 0.5).slice(0, 2).map(o => o.he);
      return { domain, id: v.id, prompt: "מה הפירוש של המילה:", enText: v.en,
               options: shuffle([v.he, ...wrong]), answer: v.he };
    });
  } else if (domain === "grammar") {
    pool = GRAMMAR.filter(g => g.level === difficulty && !usedIds.has(g.id)).map(g => ({
      domain, id: g.id, prompt: "השלימו את המשפט:", enText: g.q,
      options: g.options, answer: g.answer, ltrOptions: true,
    }));
  } else if (domain === "reading") {
    pool = READING.filter(r => r.level === difficulty && !usedIds.has(r.id)).map(r => ({
      domain, id: r.id, prompt: "קראו את הקטע וענו:", passage: r.text,
      enText: r.questions[0].q, options: r.questions[0].options, answer: r.questions[0].answer, ltrOptions: true,
    }));
  } else if (domain === "sentence") {
    pool = SENTENCES.filter(s => s.level === difficulty && !usedIds.has(s.id)).map(s => ({
      domain, id: s.id, prompt: "סדרו את המילים למשפט תקין:", sentence: s,
    }));
  } else if (domain === "spelling") {
    pool = SPELLING.filter(p => p.level === difficulty && !usedIds.has(p.id)).map(p => ({
      domain, id: p.id,
      prompt: p.type === "missing" ? `איזו אות חסרה במילה? (${p.he})` : `מה הכתיב הנכון? (${p.he})`,
      enText: p.type === "missing" ? p.display : null,
      options: p.options, answer: p.answer, ltrOptions: true,
    }));
  }
  if (!pool.length) return null;
  return pool[Math.floor(Math.random() * pool.length)];
}

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

// חישוב ציון 1-5 לכל תחום מתוך תשובות האבחון
function computeScores(answers) {
  const scores = {};
  Object.keys(DOMAINS).forEach(domain => {
    const rel = answers.filter(a => a.domain === domain);
    if (!rel.length) { scores[domain] = 3; return; }
    // תשובה נכונה ברמה d שווה d+2, טעות ברמה d שווה d-1 — ואז ממוצע, תחום 1-5
    const avg = rel.reduce((sum, a) => sum + (a.correct ? a.difficulty + 2 : a.difficulty - 1), 0) / rel.length;
    scores[domain] = Math.max(1, Math.min(5, Math.round(avg)));
  });
  return scores;
}

const CONFIDENCE_OPTIONS = [
  { id:"speak",   label:"לדבר ולהגות מילים" },
  { id:"vocab",   label:"להבין מילים חדשות" },
  { id:"grammar", label:"דקדוק וזמנים" },
  { id:"reading", label:"לקרוא טקסטים ארוכים" },
  { id:"spelling",label:"לכתוב בלי שגיאות כתיב" },
  { id:"ok",      label:"בעצם... די בסדר לי 😎" },
];

function DiagnosticScreen({ onComplete, sound }) {
  const [step, setStep] = useState(0);
  const [difficulty, setDifficulty] = useState({ vocab:2, grammar:2, reading:2, sentence:2, spelling:2 });
  const [answers, setAnswers] = useState([]);
  const [question, setQuestion] = useState(null);
  const [answerState, setAnswerState] = useState({}); // option -> state
  const [locked, setLocked] = useState(false);
  const usedIds = useRef(new Set());

  const total = DIAG_SEQUENCE.length;
  const domain = DIAG_SEQUENCE[step];

  useEffect(() => {
    if (domain && domain !== "confidence") {
      // אדפטיבי: אם אין שאלה ברמה המבוקשת, מנסים רמות שכנות
      let q = pickDiagQuestion(domain, difficulty[domain], usedIds.current);
      if (!q) q = pickDiagQuestion(domain, Math.max(1, difficulty[domain]-1), usedIds.current);
      if (!q) q = pickDiagQuestion(domain, Math.min(3, difficulty[domain]+1), usedIds.current);
      if (q) usedIds.current.add(q.id);
      setQuestion(q);
      setAnswerState({});
      setLocked(false);
    }
  }, [step]);

  function recordAnswer(correct) {
    const d = difficulty[domain];
    setAnswers(prev => [...prev, { domain, difficulty: d, correct }]);
    // התאמת קושי: צדק — מקשים, טעה — מקלים. בלי עונשים, רק איסוף מידע.
    setDifficulty(prev => ({ ...prev, [domain]: correct ? Math.min(3, d+1) : Math.max(1, d-1) }));
    playTone(correct, sound);
    setTimeout(() => setStep(s => s + 1), correct ? 700 : 1100);
  }

  function handleOption(opt) {
    if (locked) return;
    setLocked(true);
    const correct = opt === question.answer;
    const st = {};
    question.options.forEach(o => {
      st[o] = o === opt ? (correct ? "correct" : "wrong") : (o === question.answer && !correct ? "reveal" : "dim");
    });
    setAnswerState(st);
    recordAnswer(correct);
  }

  function handleConfidence(opt) {
    const scores = computeScores(answers);
    onComplete(scores, opt.id);
  }

  if (step >= total) return null;

  return (
    <div className="max-w-lg mx-auto p-5 min-h-screen flex flex-col">
      <div className="mb-6 mt-2">
        <div className="flex justify-between text-sm text-slate-500 mb-2">
          <span>שאלה {step + 1} מתוך {total}</span>
          <span>🕹️ משחק היכרות</span>
        </div>
        <ProgressBar value={step} max={total} color="bg-gradient-to-l from-indigo-500 to-fuchsia-500" />
      </div>

      {domain === "confidence" ? (
        <div className="slide-in">
          <h2 className="text-2xl font-bold text-slate-800 mb-2">שאלה אחרונה 💬</h2>
          <p className="text-slate-600 mb-6">מה הכי מאתגר אותך באנגלית? (אין תשובה לא נכונה)</p>
          <div className="space-y-3">
            {CONFIDENCE_OPTIONS.map(o => (
              <AnswerButton key={o.id} text={o.label} state="idle" onClick={() => handleConfidence(o)} />
            ))}
          </div>
        </div>
      ) : question ? (
        <div className="slide-in" key={step}>
          <div className="text-sm font-bold text-indigo-500 mb-1">{DOMAINS[domain].icon} {DOMAINS[domain].name}</div>
          <h2 className="text-xl font-bold text-slate-800 mb-4">{question.prompt}</h2>
          {question.passage && (
            <div className="en bg-white rounded-2xl p-4 mb-4 text-base leading-relaxed shadow-sm border border-slate-100">{question.passage}</div>
          )}
          {question.enText && (
            <div className="en text-2xl font-bold text-center bg-white rounded-2xl py-5 px-4 mb-5 shadow-sm border border-slate-100">{question.enText}</div>
          )}
          {question.sentence ? (
            <SentenceBuilder item={question.sentence} onDone={recordAnswer} sound={sound} hideFeedbackDelay />
          ) : (
            <div className="space-y-3">
              {question.options.map(o => (
                <AnswerButton key={o} text={o} ltr={question.ltrOptions} state={answerState[o] || "idle"} onClick={() => handleOption(o)} />
              ))}
            </div>
          )}
          <p className="text-center text-xs text-slate-400 mt-6">אין נקודות ואין ציונים כאן — רק לומדים להכיר אותך 🙂</p>
        </div>
      ) : null}
    </div>
  );
}

/* ============================================================
   רכיב בניית משפט (משמש גם באבחון וגם בתרגול)
   טאפ על מילים במקום גרירה — נוח יותר במגע
   ============================================================ */

function SentenceBuilder({ item, onDone, sound }) {
  const words = item.answer.split(" ");
  const [bank, setBank] = useState(() => shuffle(words.map((w, i) => ({ w, i }))));
  const [chosen, setChosen] = useState([]);
  const [result, setResult] = useState(null); // null | true | false

  function pick(tok) {
    if (result !== null) return;
    setBank(b => b.filter(t => t.i !== tok.i));
    setChosen(c => [...c, tok]);
  }
  function unpick(tok) {
    if (result !== null) return;
    setChosen(c => c.filter(t => t.i !== tok.i));
    setBank(b => [...b, tok]);
  }

  useEffect(() => {
    if (chosen.length === words.length && result === null) {
      const built = chosen.map(t => t.w).join(" ");
      const ok = built.toLowerCase() === item.answer.toLowerCase();
      setResult(ok);
      playTone(ok, sound);
      setTimeout(() => onDone(ok), ok ? 800 : 1600);
    }
  }, [chosen]);

  return (
    <div>
      {item.he && <div className="text-center text-slate-500 mb-3">💡 רמז: "{item.he}"</div>}
      <div className={`en min-h-[64px] bg-white rounded-2xl p-3 mb-4 flex flex-wrap gap-2 items-center justify-center border-2 ${
        result === true ? "border-emerald-400 bg-emerald-50" : result === false ? "border-rose-300 bg-rose-50" : "border-dashed border-slate-300"}`}>
        {chosen.length === 0 && <span className="text-slate-300 text-sm">הקישו על המילים לפי הסדר</span>}
        {chosen.map(tok => (
          <button key={tok.i} onClick={() => unpick(tok)}
            className="px-3 py-2 bg-indigo-100 text-indigo-800 rounded-xl font-semibold text-lg no-select active:scale-95">{tok.w}</button>
        ))}
      </div>
      <div className="en flex flex-wrap gap-2 justify-center mb-2">
        {bank.map(tok => (
          <button key={tok.i} onClick={() => pick(tok)}
            className="px-3 py-2 bg-white border-2 border-slate-200 rounded-xl font-semibold text-lg shadow-sm no-select active:scale-95">{tok.w}</button>
        ))}
      </div>
      {result === false && (
        <div className="text-center mt-3 slide-in">
          <span className="text-slate-500 text-sm">המשפט הנכון: </span>
          <span className="en font-bold text-emerald-600">{item.answer}</span>
        </div>
      )}
      {result === true && <div className="text-center mt-2 text-emerald-600 font-bold text-lg pop">מעולה! 🎉</div>}
    </div>
  );
}

/* ============================================================
   קושי דינמי בפעילויות
   ============================================================ */

// רמת קושי נוכחית (1-3) לפי ציון הפרופיל + ביצועים אחרונים בסשן
function dynamicLevel(profile, domain, sessionResults) {
  let base = Math.max(1, Math.min(3, Math.ceil(profile.scores[domain] / 2)));
  const recent = sessionResults.slice(-3);
  if (recent.length >= 2) {
    if (recent.every(r => r)) base = Math.min(3, base + 1);
    else if (recent.every(r => !r)) base = Math.max(1, base - 1);
  }
  return base;
}

// עדכון פרופיל אחרי פעילות: XP, streak, ציון תחום, משימה יומית
function applySessionToProfile(profile, domain, results, xpGained, isDaily) {
  const p = { ...profile };
  p.xp += xpGained;
  // עדכון עדין של ציון התחום לפי הצלחה בסשן
  const rate = results.length ? results.filter(Boolean).length / results.length : 0.5;
  const cur = p.scores[domain];
  if (rate >= 0.8 && results.length >= 4) p.scores = { ...p.scores, [domain]: Math.min(5, cur + 1) };
  else if (rate <= 0.3 && results.length >= 4) p.scores = { ...p.scores, [domain]: Math.max(1, cur - 1) };
  // streak יומי
  const today = todayStr();
  if (p.lastActiveDate !== today) {
    p.streak = p.lastActiveDate === yesterdayStr() ? p.streak + 1 : 1;
    p.lastActiveDate = today;
  }
  if (isDaily) p.dailyDoneDate = today;
  p.recent = { ...p.recent, [domain]: [...(p.recent[domain] || []), ...results].slice(-20) };
  return p;
}

/* ============================================================
   פעילות: כרטיסיות מילים — חזרה מרווחת (Leitner)
   ============================================================ */

const SRS_INTERVALS_DAYS = [0, 1, 2, 4, 7, 14]; // לפי קופסה 0-5

function dueWords(profile, extraWords) {
  const now = Date.now();
  const all = [...VOCAB, ...(extraWords || [])];
  const due = all.filter(w => {
    const s = profile.srs[w.id];
    return !s || s.due <= now;
  });
  // קודם מילים שכבר טעינו בהן (קופסה נמוכה), אחר כך חדשות מתאימות לרמה
  const lvl = Math.max(1, Math.min(3, Math.ceil(profile.scores.vocab / 2)));
  due.sort((a, b) => {
    const sa = profile.srs[a.id] ? profile.srs[a.id].box : 99;
    const sb = profile.srs[b.id] ? profile.srs[b.id].box : 99;
    if (sa !== sb) return sa - sb;
    return Math.abs((a.level||2) - lvl) - Math.abs((b.level||2) - lvl);
  });
  return due;
}

function FlashcardsActivity({ profile, onFinish, onBack, showToast }) {
  const SESSION_SIZE = 7;
  const [aiWords, setAiWords] = useState([]);
  const [queue, setQueue] = useState(() => dueWords(profile).slice(0, SESSION_SIZE));
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [results, setResults] = useState([]);
  const [srsUpdates, setSrsUpdates] = useState({});
  const [loadingAi, setLoadingAi] = useState(false);

  const word = queue[idx];
  const sound = profile.settings.sound;

  function grade(knew) {
    playTone(knew, sound);
    const cur = profile.srs[word.id] || { box: 0 };
    const newBox = knew ? Math.min(5, cur.box + 1) : 0;
    const due = Date.now() + SRS_INTERVALS_DAYS[newBox] * 24 * 3600 * 1000;
    setSrsUpdates(u => ({ ...u, [word.id]: { box: newBox, due } }));
    setResults(r => [...r, knew]);
    setFlipped(false);
    if (idx + 1 >= queue.length) {
      finish([...results, knew], { ...srsUpdates, [word.id]: { box: newBox, due } });
    } else setIdx(i => i + 1);
  }

  function finish(allResults, allSrs) {
    const xp = allResults.filter(Boolean).length * 10 + 5;
    onFinish("vocab", allResults, xp, allSrs);
  }

  async function loadAiWords() {
    setLoadingAi(true);
    try {
      const items = await aiGenerateVocab(profile.settings.apiKey, profile);
      setAiWords(items);
      setQueue(q => [...q, ...items]);
      showToast("✨ נוספו מילים חדשות מותאמות אישית!");
    } catch (e) {
      showToast("ה-AI לא זמין כרגע — ממשיכים עם המאגר המובנה 🙂");
    }
    setLoadingAi(false);
  }

  if (!word) {
    return (
      <div className="max-w-lg mx-auto p-5 min-h-screen flex flex-col justify-center text-center">
        <div className="text-5xl mb-3">🌴</div>
        <h2 className="text-xl font-bold text-slate-800 mb-2">אין מילים שמחכות לחזרה כרגע!</h2>
        <p className="text-slate-500 mb-6">החזרה המרווחת תחזיר מילים בדיוק כשתתחילו לשכוח אותן.</p>
        <BigButton onClick={onBack}>חזרה הביתה</BigButton>
      </div>
    );
  }

  return (
    <div className="max-w-lg mx-auto p-5 min-h-screen">
      <ActivityHeader title="כרטיסיות מילים" icon="📚" onBack={onBack} progress={idx} total={queue.length} />
      <div key={word.id + (flipped ? "b" : "f")}
        onClick={() => setFlipped(f => !f)}
        className="bg-white rounded-3xl shadow-lg p-8 min-h-[260px] flex flex-col items-center justify-center cursor-pointer pop no-select">
        {!flipped ? (
          <React.Fragment>
            <div className="en text-4xl font-black text-slate-800 mb-3">{word.en}</div>
            <button onClick={e => { e.stopPropagation(); speak(word.en); }}
              className="text-2xl bg-indigo-50 rounded-full w-12 h-12 mb-4">🔊</button>
            <div className="text-slate-400 text-sm">הקישו על הכרטיס כדי להפוך</div>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <div className="text-3xl font-black text-indigo-600 mb-3">{word.he}</div>
            <div className="en text-base text-slate-500 text-center mb-2">"{word.sentence}"</div>
            <button onClick={e => { e.stopPropagation(); speak(word.sentence); }}
              className="text-xl bg-indigo-50 rounded-full w-10 h-10">🔊</button>
          </React.Fragment>
        )}
      </div>
      {flipped && (
        <div className="grid grid-cols-2 gap-3 mt-5 slide-in">
          <BigButton onClick={() => grade(false)} color="bg-rose-400">😅 עוד לא</BigButton>
          <BigButton onClick={() => grade(true)} color="bg-emerald-500">😎 ידעתי!</BigButton>
        </div>
      )}
      {!flipped && <p className="text-center text-slate-400 text-sm mt-5">נסו להיזכר בפירוש — ואז הפכו את הכרטיס</p>}
      {profile.settings.apiKey && !aiWords.length && (
        <button onClick={loadAiWords} disabled={loadingAi}
          className="mt-6 w-full text-sm text-indigo-500 font-semibold py-2">
          {loadingAi ? "טוען מילים חדשות..." : "✨ הוסיפו מילים חדשות מותאמות אישית (AI)"}
        </button>
      )}
    </div>
  );
}

function GrammarActivity({ profile, onFinish, onBack, showToast }) {
  const SESSION_SIZE = 6;
  const [items, setItems] = useState(() => buildSession());
  const [idx, setIdx] = useState(0);
  const [results, setResults] = useState([]);
  const resultsRef = useRef([]); // מונע איבוד התשובה האחרונה בגלל closure ישן ב-setTimeout
  const [answerState, setAnswerState] = useState({});
  const [locked, setLocked] = useState(false);
  const [explainText, setExplainText] = useState(null);
  const [aiExplaining, setAiExplaining] = useState(false);
  const [loadingAi, setLoadingAi] = useState(false);
  const sound = profile.settings.sound;

  function buildSession() {
    const lvl = dynamicLevel(profile, "grammar", []);
    const pool = shuffle(GRAMMAR.filter(g => Math.abs(g.level - lvl) <= 1));
    return pool.slice(0, SESSION_SIZE);
  }

  const item = items[idx];

  function handleOption(opt) {
    if (locked) return;
    setLocked(true);
    const correct = opt === item.answer;
    const st = {};
    item.options.forEach(o => {
      st[o] = o === opt ? (correct ? "correct" : "wrong") : (o === item.answer && !correct ? "reveal" : "dim");
    });
    setAnswerState(st);
    resultsRef.current = [...resultsRef.current, correct];
    setResults(resultsRef.current);
    playTone(correct, sound);
    if (!correct) setExplainText(item.explain);
    else setTimeout(next, 800);
  }

  function next() {
    setExplainText(null); setAnswerState({}); setLocked(false);
    if (idx + 1 >= items.length) {
      const all = resultsRef.current;
      const xp = all.filter(Boolean).length * 12 + 5;
      onFinish("grammar", all, xp);
    } else setIdx(i => i + 1);
  }

  async function askAi() {
    setAiExplaining(true);
    try {
      const lastWrong = Object.keys(answerState).find(k => answerState[k] === "wrong");
      const text = await aiExplainMistake(profile.settings.apiKey, item.q, lastWrong, item.answer);
      setExplainText(text);
    } catch (e) { showToast("ה-AI לא זמין כרגע — ההסבר המובנה עדיין כאן 🙂"); }
    setAiExplaining(false);
  }

  async function loadAiItems() {
    setLoadingAi(true);
    try {
      const newItems = await aiGenerateGrammar(profile.settings.apiKey, profile);
      setItems(prev => [...prev, ...newItems]);
      showToast("✨ נוספו תרגילים חדשים מותאמים אישית!");
    } catch (e) { showToast("ה-AI לא זמין כרגע — ממשיכים עם המאגר המובנה 🙂"); }
    setLoadingAi(false);
  }

  if (!item) return null;

  return (
    <div className="max-w-lg mx-auto p-5 min-h-screen">
      <ActivityHeader title="מעבדת דקדוק" icon="🧩" onBack={onBack} progress={idx} total={items.length} />
      <h2 className="text-lg font-bold text-slate-700 mb-3">השלימו את המשפט:</h2>
      <div className="en text-2xl font-bold text-center bg-white rounded-2xl py-6 px-4 mb-5 shadow-sm border border-slate-100" key={item.id}>{item.q}</div>
      <div className="space-y-3">
        {item.options.map(o => (
          <AnswerButton key={o} text={o} ltr state={answerState[o] || "idle"} onClick={() => handleOption(o)} />
        ))}
      </div>
      {explainText && (
        <div className="mt-5 bg-sky-50 border border-sky-200 rounded-2xl p-4 slide-in">
          <div className="font-bold text-sky-700 mb-1">💡 רגע של למידה</div>
          <p className="text-slate-700 text-sm leading-relaxed">{explainText}</p>
          {profile.settings.apiKey && (
            <button onClick={askAi} disabled={aiExplaining} className="text-indigo-500 text-xs font-semibold mt-2">
              {aiExplaining ? "חושב..." : "✨ הסבר מותאם אישית (AI)"}
            </button>
          )}
          <div className="mt-3"><BigButton onClick={next} color="bg-sky-500">הבנתי, ממשיכים →</BigButton></div>
        </div>
      )}
      {profile.settings.apiKey && idx === items.length - 1 && !explainText && (
        <button onClick={loadAiItems} disabled={loadingAi} className="mt-6 w-full text-sm text-indigo-500 font-semibold py-2">
          {loadingAi ? "יוצר תרגילים..." : "✨ עוד תרגילים מותאמים אישית (AI)"}
        </button>
      )}
    </div>
  );
}

function ListeningActivity({ profile, onFinish, onBack }) {
  const SESSION_SIZE = 5;
  const [items] = useState(() => {
    const lvl = Math.max(1, Math.min(3, Math.ceil(profile.scores.vocab / 2)));
    return shuffle(VOCAB.filter(v => Math.abs(v.level - lvl) <= 1)).slice(0, SESSION_SIZE);
  });
  const [idx, setIdx] = useState(0);
  const [results, setResults] = useState([]);
  const resultsRef = useRef([]); // מונע איבוד התשובה האחרונה בגלל closure ישן ב-setTimeout
  const [mode, setMode] = useState("listen"); // listen -> (speak אם נתמך)
  const [answerState, setAnswerState] = useState({});
  const [options, setOptions] = useState([]);
  const [locked, setLocked] = useState(false);
  const [recState, setRecState] = useState("idle"); // idle | recording | good | tryagain
  const sound = profile.settings.sound;

  const word = items[idx];

  useEffect(() => {
    if (!word) return;
    const wrong = VOCAB.filter(o => o.id !== word.id).sort(() => Math.random()-0.5).slice(0,2).map(o => o.he);
    setOptions(shuffle([word.he, ...wrong]));
    setAnswerState({}); setLocked(false); setMode("listen"); setRecState("idle");
    setTimeout(() => speak(word.en), 400);
  }, [idx]);

  function handleOption(opt) {
    if (locked) return;
    setLocked(true);
    const correct = opt === word.he;
    const st = {};
    options.forEach(o => { st[o] = o === opt ? (correct ? "correct" : "wrong") : (o === word.he && !correct ? "reveal" : "dim"); });
    setAnswerState(st);
    playTone(correct, sound);
    resultsRef.current = [...resultsRef.current, correct];
    setResults(resultsRef.current);
    setTimeout(() => {
      if (SpeechRec) setMode("speak");
      else next();
    }, 900);
  }

  function next() {
    if (idx + 1 >= items.length) {
      const all = resultsRef.current;
      const xp = all.filter(Boolean).length * 12 + 10;
      onFinish("vocab", all, xp);
    } else setIdx(i => i + 1);
  }

  function startRecording() {
    try {
      const rec = new SpeechRec();
      rec.lang = "en-US"; rec.interimResults = false; rec.maxAlternatives = 3;
      setRecState("recording");
      rec.onresult = e => {
        const transcripts = Array.from(e.results[0]).map(r => r.transcript.toLowerCase().trim());
        const ok = transcripts.some(t => t.includes(word.en.toLowerCase()));
        setRecState(ok ? "good" : "tryagain");
        playTone(ok, sound);
      };
      rec.onerror = () => setRecState("tryagain");
      rec.onend = () => setRecState(s => (s === "recording" ? "tryagain" : s));
      rec.start();
    } catch (e) { setRecState("tryagain"); }
  }

  if (!word) return null;

  return (
    <div className="max-w-lg mx-auto p-5 min-h-screen">
      <ActivityHeader title="אוזן זהב" icon="🎧" onBack={onBack} progress={idx} total={items.length} />
      {mode === "listen" ? (
        <div key={word.id}>
          <h2 className="text-lg font-bold text-slate-700 mb-4 text-center">איזו מילה שמעתם?</h2>
          <button onClick={() => speak(word.en)}
            className="mx-auto block text-5xl bg-white rounded-full w-24 h-24 shadow-lg mb-2 active:scale-95">🔊</button>
          <button onClick={() => speak(word.en, 0.6)} className="mx-auto block text-xs text-indigo-500 font-semibold mb-6">🐢 לאט יותר</button>
          <div className="space-y-3">
            {options.map(o => (
              <AnswerButton key={o} text={o} state={answerState[o] || "idle"} onClick={() => handleOption(o)} />
            ))}
          </div>
        </div>
      ) : (
        <div className="text-center slide-in">
          <h2 className="text-lg font-bold text-slate-700 mb-2">עכשיו אתם! אמרו את המילה:</h2>
          <div className="en text-4xl font-black text-slate-800 mb-1">{word.en}</div>
          <div className="text-slate-400 text-sm mb-6">{word.he}</div>
          {recState === "good" ? (
            <div className="pop">
              <div className="text-5xl mb-3">🌟</div>
              <div className="text-emerald-600 font-bold text-xl mb-6">הגייה מצוינת!</div>
              <BigButton onClick={next} color="bg-emerald-500">ממשיכים →</BigButton>
            </div>
          ) : (
            <div>
              <button onClick={startRecording} disabled={recState === "recording"}
                className={`mx-auto block text-5xl rounded-full w-24 h-24 shadow-lg mb-4 active:scale-95 ${recState === "recording" ? "bg-rose-100 animate-pulse" : "bg-white"}`}>
                🎤
              </button>
              <div className="text-slate-500 text-sm mb-6">
                {recState === "recording" ? "מקשיבים... דברו עכשיו!" :
                 recState === "tryagain" ? "כמעט! שמעו שוב ונסו עוד פעם 🙂" : "הקישו על המיקרופון ואמרו את המילה"}
              </div>
              {recState === "tryagain" && (
                <button onClick={() => speak(word.en, 0.7)} className="text-indigo-500 text-sm font-semibold mb-4 block mx-auto">🔊 שמעו שוב</button>
              )}
              <button onClick={next} className="text-slate-400 text-sm font-semibold">דלגו לשאלה הבאה ←</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

        <p className="text-xs text-slate-500 mb-3">
          עם מפתח, האפליקציה תוכל ליצור תרגילים והסברים מותאמים אישית.
          המפתח נשמר רק בדפדפן שלכם (localStorage) ולא נשלח לשום מקום חוץ מ-Anthropic.
          בלי מפתח — הכל עובד עם מאגר התרגילים המובנה.
        </p>
        <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)}
          placeholder="sk-ant-..." dir="ltr"
          className="w-full border-2 border-slate-200 rounded-xl px-4 py-3 text-sm en focus:border-indigo-400 outline-none" />
      </div>

      <div className="bg-white rounded-2xl p-5 shadow-sm mb-4 flex items-center justify-between">
        <div>
          <div className="font-bold text-slate-700">🔔 צלילי פידבק</div>
          <div className="text-xs text-slate-500">צליל קצר על כל תשובה</div>
        </div>
        <button onClick={() => setSoundOn(s => !s)}
          className={`w-14 h-8 rounded-full transition-colors relative ${soundOn ? "bg-emerald-400" : "bg-slate-300"}`}>
          <span className={`absolute top-1 w-6 h-6 bg-white rounded-full shadow transition-all ${soundOn ? "right-1" : "right-7"}`} />
        </button>
      </div>

      <BigButton onClick={() => onSave({ apiKey: apiKey.trim(), sound: soundOn })} color="bg-indigo-600" className="mb-6">שמירה</BigButton>

      <div className="bg-rose-50 border border-rose-200 rounded-2xl p-5">
        <div className="font-bold text-rose-700 mb-1">🗑️ אתחול פרופיל</div>
        <p className="text-xs text-rose-600 mb-3">מוחק את כל ההתקדמות, הניקוד והאבחון — ומתחיל מההתחלה.</p>
        {!confirmReset ? (
          <button onClick={() => setConfirmReset(true)} className="text-rose-600 font-bold text-sm border-2 border-rose-300 rounded-xl px-4 py-2">אתחול פרופיל...</button>
        ) : (
          <div className="flex gap-3">
            <button onClick={onReset} className="bg-rose-500 text-white font-bold text-sm rounded-xl px-4 py-2">כן, למחוק הכל</button>
            <button onClick={() => setConfirmReset(false)} className="text-slate-500 font-bold text-sm px-4 py-2">ביטול</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   מסך פתיחה
   ============================================================ */

function WelcomeScreen({ onStart }) {
  return (
    <div className="max-w-lg mx-auto p-6 min-h-screen flex flex-col justify-center text-center">
      <div className="text-7xl mb-4">🚀</div>
      <h1 className="text-4xl font-black text-slate-800 mb-3">EnglishQuest</h1>
      <p className="text-slate-600 text-lg leading-relaxed mb-2">לומדים אנגלית כמו משחק — בקצב שלך, בדרך שלך.</p>
      <p className="text-slate-500 text-sm mb-8">נתחיל עם משחק היכרות קצר (בערך 3 דקות) כדי לבנות לך מסלול אישי. בלי ציונים, בלי לחץ. 😉</p>
      <BigButton onClick={onStart} color="bg-gradient-to-l from-indigo-600 to-fuchsia-600">בואו נתחיל! 🎮</BigButton>
    </div>
  );
}

/* ============================================================
   האפליקציה הראשית — ניווט ומצב
   ============================================================ */

function App() {
  const [profile, setProfile] = useState(loadProfile);
  const [screen, setScreen] = useState(() => (loadProfile().onboardingDone ? "home" : "welcome"));
  const [sessionDone, setSessionDone] = useState(null); // { domain, results, xp }
  const [isDailySession, setIsDailySession] = useState(false);
  const [xpFloat, setXpFloat] = useState(0);
  const [toast, setToast] = useState("");
  const toastTimer = useRef(null);

  // שמירה אוטומטית של כל שינוי בפרופיל
  useEffect(() => { saveProfile(profile); }, [profile]);

  function showToast(msg) {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(""), 3000);
  }

  function handleDiagnosticComplete(scores, focusArea) {
    setProfile(p => ({ ...p, scores, focusArea, onboardingDone: true }));
    setScreen("playerCard");
  }

  function startActivity(activityId, isDaily) {
    setIsDailySession(isDaily);
    setScreen(activityId);
  }

  // סיום פעילות: עדכון פרופיל + מסך סיכום
  function finishSession(domain, results, xp, srsUpdates) {
    setProfile(p => {
      let updated = applySessionToProfile(p, domain, results, xp, isDailySession);
      if (srsUpdates) updated = { ...updated, srs: { ...updated.srs, ...srsUpdates } };
      return updated;
    });
    setXpFloat(xp);
    setTimeout(() => setXpFloat(0), 1100);
    setSessionDone({ domain, results, xp });
    setScreen("sessionDone");
  }

  function saveSettings(settings) {
    setProfile(p => ({ ...p, settings }));
    showToast("ההגדרות נשמרו ✅");
    setScreen("home");
  }

  function resetProfile() {
    localStorage.removeItem(STORAGE_KEY);
    const fresh = { ...DEFAULT_PROFILE };
    setProfile(fresh);
    setScreen("welcome");
  }

  const common = { profile, onBack: () => setScreen("home"), onFinish: finishSession, showToast };

  return (
    <div className="min-h-screen">
      {screen === "welcome" && <WelcomeScreen onStart={() => setScreen("diagnostic")} />}
      {screen === "diagnostic" && <DiagnosticScreen onComplete={handleDiagnosticComplete} sound={profile.settings.sound} />}
      {screen === "playerCard" && <PlayerCardScreen profile={profile} onContinue={() => setScreen("home")} />}
      {screen === "home" && <HomeScreen profile={profile} onStart={startActivity} onSettings={() => setScreen("settings")} />}
      {screen === "flashcards" && <FlashcardsActivity {...common} />}
      {screen === "grammar" && <GrammarActivity {...common} />}
      {screen === "reading" && <ReadingActivity {...common} />}
      {screen === "sentence" && <SentenceActivity {...common} />}
      {screen === "spelling" && <SpellingActivity {...common} />}
      {screen === "listening" && <ListeningActivity {...common} />}
      {screen === "sessionDone" && sessionDone && (
        <SessionDoneScreen {...sessionDone} onHome={() => { setSessionDone(null); setScreen("home"); }} />
      )}
      {screen === "settings" && (
        <SettingsScreen profile={profile} onSave={saveSettings} onBack={() => setScreen("home")} onReset={resetProfile} />
      )}
      <XpFloat amount={xpFloat} />
      <Toast msg={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
